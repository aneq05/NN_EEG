project:
  name: eeg_multiclass_xai
  seed: 42

paths:
  raw_data: data/raw/data.csv
  processed_dir: data/processed
  figures_dir: outputs/figures
  tables_dir: outputs/tables
  metrics_dir: outputs/metrics
  models_dir: outputs/models
  lime_dir: outputs/lime
  report_dir: reports

data:
  source_name: "Epileptic Seizure Recognition"
  kaggle_slug: "harunshimanto/epileptic-seizure-recognition"
  target_column: y
  id_columns:
    - Unnamed
  test_size: 0.15
  val_size: 0.15
  random_state: 42
  remove_duplicates: true
  outlier_clip_quantiles: [0.001, 0.999]

labels:
  1: epileptic_seizure
  2: tumor_area_eeg
  3: healthy_area_eeg
  4: eyes_closed
  5: eyes_open

model:
  input_dim: 178
  num_classes: 5
  hidden_dims: [256, 128, 64]
  dropout: 0.30

training:
  max_epochs: 35
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8
  accelerator: cpu

optuna:
  enabled: true
  n_trials: 5
  timeout_seconds: 900

xai:
  permutation_repeats: 3
  lime_global_instances: 120
  lime_local_cases_per_group: 4
  lime_num_features: 12
  lime_num_samples: 3000

